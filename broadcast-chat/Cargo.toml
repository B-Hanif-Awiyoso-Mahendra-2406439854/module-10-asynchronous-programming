[package]
name = "broadcast-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-websockets = { version = "0.13", features = ["client", "fastrand", "server", "sha1_smol"] }
